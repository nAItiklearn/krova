<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krova · layout switcher prototype</title>
<!-- Standalone interaction prototype. No dependencies, no network.
     Not part of the app build: open this file directly in a browser. -->
<style>
  :root {
    color-scheme: dark;
    --font: system-ui, -apple-system, 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
    --bg: #0b0d11; --card: #171a21; --card-edge: rgb(255 255 255 / 0.08);
    --text: #eef0f4; --muted: #9aa3b5; --accent: #7da4ff;
    --zone: rgb(125 164 255 / 0.16); --zone-edge: rgb(125 164 255 / 0.55); --danger: #ff8a80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.4 var(--font); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 700px at 20% 10%, #1b2a4a 0%, transparent 60%),
      radial-gradient(900px 600px at 85% 90%, #2a1d3a 0%, transparent 60%), var(--bg);
  }
  .desk { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 10px 58px; }
  .desk div { border-radius: 10px; background: rgb(255 255 255 / 0.05); border: 1px solid rgb(255 255 255 / 0.06); }
  .desk div:first-child { grid-row: span 2; }
  .reopen {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font: inherit; color: var(--text);
    background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.12); border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .reopen kbd { font: 12px var(--font); color: var(--muted); margin-left: 6px; }
  .scrim {
    position: fixed; inset: 0; background: rgb(6 8 12 / 0.55);
    backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
    opacity: 0; pointer-events: none;
  }
  .scrim.open { pointer-events: auto; }
  .head { position: absolute; top: 28px; left: 0; right: 0; text-align: center; font-weight: 600; z-index: 2000; }
  .head small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; font-size: 12px; }
  .stage { position: absolute; inset: 0; touch-action: none; user-select: none; }
  .card {
    position: absolute; left: 50%; top: 0; width: 380px; margin-left: -190px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--card-edge); padding: 12px;
    box-shadow: 0 1px 0 rgb(255 255 255 / 0.05) inset, 0 18px 40px -12px rgb(0 0 0 / 0.6);
    will-change: transform, opacity; cursor: pointer; outline: none; transform-origin: 50% 0;
  }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--accent), 0 18px 40px -12px rgb(0 0 0 / 0.6); }
  .card.lifted { box-shadow: 0 1px 0 rgb(255 255 255 / 0.06) inset, 0 30px 60px -10px rgb(0 0 0 / 0.75); cursor: grabbing; }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 9px; background: #0f1218; overflow: hidden; border: 1px solid rgb(255 255 255 / 0.05); }
  .zone { position: absolute; border-radius: 5px; background: var(--zone); border: 1px solid var(--zone-edge); }
  .zone span { position: absolute; left: 7px; top: 5px; font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .meta { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; padding: 0 2px; height: 22px; }
  .shade { position: absolute; inset: 0; border-radius: 16px; background: #05070a; pointer-events: none; opacity: 0; }
  .name { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  .badge { font-size: 11px; color: #0a1226; background: var(--accent); border-radius: 999px; padding: 1px 7px; font-weight: 600; }
  .grip { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); cursor: grab; margin-right: -4px; }
  .grip:hover { background: rgb(255 255 255 / 0.06); }
  .dismiss-hint { position: absolute; inset: 0; border-radius: 16px; pointer-events: none; box-shadow: inset 0 0 0 2px var(--danger); opacity: 0; }
  .hints { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; color: var(--muted); font-size: 12px; z-index: 2000; flex-wrap: wrap; }
  .hints kbd { font: 11px var(--font); color: var(--text); background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.1); border-radius: 5px; padding: 1px 5px; margin-right: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translate(-50%, 20px); z-index: 3000;
    background: #20242d; border: 1px solid rgb(255 255 255 / 0.1); border-radius: 12px; padding: 9px 10px 9px 14px;
    display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; box-shadow: 0 12px 30px -10px rgb(0 0 0 / 0.6);
  }
  .toast button { font: inherit; color: var(--accent); background: transparent; border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .toast button:hover { background: rgb(125 164 255 / 0.12); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="desk" aria-hidden="true"><div></div><div></div><div></div></div>
<button class="reopen" id="reopen">Switch layout <kbd>Ctrl+Alt+Shift+Space</kbd></button>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-label="Switch layout">
  <div class="head">Layouts<small>Display 1 · 2560 × 1440</small></div>
  <div class="stage" id="stage" role="listbox" aria-label="Saved layouts" tabindex="-1"></div>
  <div class="hints" aria-hidden="true">
    <span><kbd>↑</kbd><kbd>↓</kbd>or drag to flip through</span>
    <span><kbd>Enter</kbd>apply</span>
    <span><kbd>Alt</kbd><kbd>↑↓</kbd>or grip to reorder</span>
    <span><kbd>Del</kbd>or swipe sideways to delete</span>
    <span><kbd>Esc</kbd>close</span>
  </div>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="undo" hidden>Undo</button></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
'use strict';
/* Spring: damped harmonic oscillator, fixed 240 Hz substeps so the feel does
   not depend on the display's frame rate. Velocity is in units per second. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
class Spring {
  constructor(v, { k = 420, zeta = 0.86 } = {}) { this.value = v; this.target = v; this.vel = 0; this.k = k; this.c = 2 * Math.sqrt(k) * zeta; }
  set(t, { vel } = {}) { this.target = t; if (vel !== undefined) this.vel = vel; if (REDUCED) this.jump(t); }
  jump(v) { this.value = this.target = v; this.vel = 0; }
  step(dt) {
    const h = 1 / 240;
    for (let t = 0; t < dt; t += h) { const a = -this.k * (this.value - this.target) - this.c * this.vel; this.vel += a * h; this.value += this.vel * h; }
  }
  get settled() { return Math.abs(this.value - this.target) < 1e-3 && Math.abs(this.vel) < 1e-2; }
}

/* Synthetic data. Shape mirrors krova-core Layout (normalized zone rects). */
let layouts = [
  { id: 'coding', name: 'Coding', zones: [[0,0,.5,1],[.5,0,.5,.5],[.5,.5,.5,.5]] },
  { id: 'writing', name: 'Writing', zones: [[0,0,.62,1],[.62,0,.38,1]] },
  { id: 'review', name: 'Review', zones: [[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]] },
  { id: 'focus', name: 'Focus', zones: [[0,0,.22,1],[.22,0,.56,1],[.78,0,.22,1]] },
  { id: 'present', name: 'Presenting', zones: [[0,0,.74,1],[.74,0,.26,.5],[.74,.5,.26,.5]] },
  { id: 'thirds', name: 'Thirds', zones: [[0,0,1/3,1],[1/3,0,1/3,1],[2/3,0,1/3,1]] },
];
let activeId = 'coding';

/* Deck geometry. d = scroll - slot. The card in focus (d = 0) is in front
   and fully visible. The layouts after it (d < 0) stack behind it, each
   showing its title strip, a little smaller and darker per step. Cards
   already flipped past (d > 0) slide down and fade out below. */
const STEP_BEHIND = 50, DRAG_PX = 120, HINTS = 96;
const stage = document.getElementById('stage'), scrim = document.getElementById('scrim'), live = document.getElementById('live');
let cardH = 260;
const below = () => cardH * 0.9;
const focusY = () => Math.max(120 + 4 * STEP_BEHIND, Math.round((stage.clientHeight - HINTS - cardH) * 0.62 + 4 * STEP_BEHIND * 0.38));
function place(d) {
  if (d >= 0) return { y: d * below(), s: 1 - Math.min(d, 1) * 0.04, o: Math.max(0, 1 - d * 1.1), shade: 0 };
  const t = -d;
  return { y: -t * STEP_BEHIND, s: Math.max(0.82, 1 - t * 0.045), o: Math.max(0, 1 - Math.max(0, t - 3.4) * 0.8), shade: Math.min(0.5, t * 0.14) };
}
const unplace = (y) => (y >= 0 ? y / below() : y / STEP_BEHIND);

const cards = new Map();
const idxOf = (c) => layouts.findIndex((l) => cards.get(l.id) === c);
function makeCard(l) {
  const el = document.createElement('div');
  el.className = 'card'; el.setAttribute('role', 'option'); el.tabIndex = -1; el.dataset.id = l.id;
  el.innerHTML =
    `<div class="meta"><span class="name"></span><span class="badge" hidden>Active</span><span class="sub">${l.zones.length} zones</span>
       <span class="grip" title="Drag to reorder" aria-hidden="true"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="7" r="1.4"/><circle cx="8" cy="7" r="1.4"/><circle cx="2" cy="12" r="1.4"/><circle cx="8" cy="12" r="1.4"/></svg></span></div>
     <div class="thumb">${l.zones.map(([x,y,w,h], i) =>
      `<div class="zone" style="left:calc(${x*100}% + 3px);top:calc(${y*100}% + 3px);width:calc(${w*100}% - 6px);height:calc(${h*100}% - 6px)"><span>${i+1}</span></div>`).join('')}</div>
     <div class="dismiss-hint"></div><div class="shade"></div>`;
  el.querySelector('.name').textContent = l.name;
  stage.appendChild(el);
  return { el, slot: new Spring(layouts.indexOf(l)), x: new Spring(0, { k: 360, zeta: 0.8 }), lift: new Spring(0, { k: 500, zeta: 0.72 }), alpha: new Spring(1, { k: 300, zeta: 1 }) };
}
function measure() { const c = cards.values().next().value; if (c) cardH = c.el.offsetHeight; }
function syncCards() {
  layouts.forEach((l, i) => {
    let c = cards.get(l.id); if (!c) { c = makeCard(l); cards.set(l.id, c); }
    c.slot.set(i);
    c.el.querySelector('.badge').hidden = l.id !== activeId;
    c.el.setAttribute('aria-label', `${l.name}, ${l.zones.length} zones${l.id === activeId ? ', active' : ''}`);
  });
  measure(); kick();
}
addEventListener('resize', kick);

const scroll = new Spring(0, { k: 300, zeta: 0.9 });
const openness = new Spring(0, { k: 340, zeta: 0.92 });
let focusIdx = 0;
const clampIdx = (i) => Math.max(0, Math.min(layouts.length - 1, i));
function markSelected() { layouts.forEach((l, j) => cards.get(l.id).el.setAttribute('aria-selected', String(j === focusIdx))); }
function setFocus(i, { animate = true } = {}) {
  if (!layouts.length) return;
  focusIdx = clampIdx(i);
  animate ? scroll.set(focusIdx) : scroll.jump(focusIdx);
  markSelected(); cards.get(layouts[focusIdx].id).el.focus({ preventScroll: true }); kick();
}

/* Render loop runs only while a spring is moving or a drag is live. */
let raf = 0, last = 0, drag = null;
const reopenBtn = document.getElementById('reopen');
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let moving = false;
  for (const s of [scroll, openness]) { s.step(dt); moving ||= !s.settled; }
  const fy = focusY(), o = openness.value;
  scrim.style.opacity = Math.max(0, Math.min(1, o));
  reopenBtn.style.visibility = o > 0.5 ? 'hidden' : 'visible';
  for (const c of cards.values()) {
    for (const s of [c.slot, c.x, c.lift, c.alpha]) { s.step(dt); moving ||= !s.settled; }
    const p = place(scroll.value - c.slot.value);
    const held = drag && drag.card === c && drag.mode === 'reorder';
    const y = (held ? drag.y : fy + p.y) + (1 - o) * 120;
    const s = (held ? 1 : p.s) * (0.94 + 0.06 * o) * (1 + c.lift.value * 0.035);
    c.el.style.transform = `translate3d(${c.x.value}px, ${y}px, 0) scale(${s}) rotate(${c.x.value / 95}deg)`;
    c.el.style.opacity = (held ? 1 : p.o) * Math.min(1, Math.max(0, o) * 1.6) * c.alpha.value * (1 - Math.min(1, Math.abs(c.x.value) / 520));
    c.el.style.zIndex = held || c.lift.value > 0.02 ? 1000 : Math.round(100 + (cards.size - c.slot.value) * 10);
    c.el.querySelector('.shade').style.opacity = held ? 0 : p.shade;
    c.el.querySelector('.dismiss-hint').style.opacity = Math.min(1, Math.max(0, (Math.abs(c.x.value) - 60) / 120));
    c.el.classList.toggle('lifted', held || c.lift.target > 0);
  }
  raf = moving || drag ? requestAnimationFrame(frame) : 0;
}

/* Pointer: vertical drag scrolls the deck (rubber band at the ends, flick
   momentum carried into the snap), sideways on a card swipes it away, the
   grip lifts a card to reorder while the others spring out of its way. */
const rubber = (o) => (o * 0.55 * 3) / (o * 0.55 + 3);
const velocity = () => { const h = drag.hist, a = h[0], b = h[h.length - 1], dt = b.t - a.t || 1; return { vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt }; };
stage.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const el = e.target.closest('.card'), card = el ? cards.get(el.dataset.id) : null;
  drag = { card, x0: e.clientX, y0: e.clientY, t0: performance.now(), scroll0: scroll.value,
           mode: card && e.target.closest('.grip') ? 'reorder' : 'pending', hist: [{ x: e.clientX, y: e.clientY, t: performance.now() }] };
  if (drag.mode === 'reorder') {
    drag.grab = e.clientY - (focusY() + place(scroll.value - card.slot.value).y);
    drag.y = e.clientY - drag.grab; card.lift.set(1);
  }
  stage.setPointerCapture(e.pointerId); kick();
});
stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now();
  drag.hist.push({ x: e.clientX, y: e.clientY, t: now });
  while (drag.hist.length > 2 && now - drag.hist[0].t > 80) drag.hist.shift();
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (drag.mode === 'pending' && Math.hypot(dx, dy) > 6) drag.mode = drag.card && Math.abs(dx) > Math.abs(dy) * 1.2 && layouts.length > 1 ? 'swipe' : 'scroll';
  if (drag.mode === 'scroll') {
    let s = drag.scroll0 + dy / DRAG_PX; const max = layouts.length - 1;
    if (s < 0) s = -rubber(-s); else if (s > max) s = max + rubber(s - max);
    scroll.jump(s);
  } else if (drag.mode === 'swipe') {
    drag.card.x.jump(dx);
  } else if (drag.mode === 'reorder') {
    drag.y = e.clientY - drag.grab;
    const to = clampIdx(Math.round(scroll.value - unplace(drag.y - focusY()))), from = idxOf(drag.card);
    if (to !== from) {
      const [l] = layouts.splice(from, 1); layouts.splice(to, 0, l);
      layouts.forEach((ll, i) => { const c = cards.get(ll.id); if (c !== drag.card) c.slot.set(i); });
      drag.card.slot.jump(to);
    }
  }
  kick();
});
function endDrag() {
  if (!drag) return;
  const { vx, vy } = velocity(), c = drag.card;
  if (drag.mode === 'pending') {
    if (c && performance.now() - drag.t0 < 450) apply(idxOf(c));
  } else if (drag.mode === 'scroll') {
    const v = vy * 1000 / DRAG_PX;                      // cards per second
    focusIdx = clampIdx(Math.round(scroll.value + v * 0.18));
    scroll.set(focusIdx, { vel: v }); markSelected();
  } else if (drag.mode === 'swipe') {
    const x = c.x.value;
    if (Math.abs(x) > 140 || Math.abs(vx) > 0.7) remove(c, Math.sign(x || vx), vx * 1000);
    else c.x.set(0, { vel: vx * 1000 });
  } else if (drag.mode === 'reorder') {
    const i = idxOf(c);
    c.slot.jump(scroll.value - unplace(drag.y - focusY())); c.slot.set(i); c.lift.set(0);
    announce(`${layouts[i].name} moved to position ${i + 1} of ${layouts.length}`);
  }
  drag = null; kick();
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
let wheelSnap = 0;
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  scroll.set(Math.max(0, Math.min(layouts.length - 1, scroll.target + e.deltaY / DRAG_PX)));
  clearTimeout(wheelSnap); wheelSnap = setTimeout(() => setFocus(Math.round(scroll.target)), 120); kick();
}, { passive: false });

/* Actions */
let undoState = null;
function remove(c, dir, v) {
  const i = idxOf(c); const [l] = layouts.splice(i, 1);
  c.x.set(dir * 600, { vel: v || dir * 1800 }); c.alpha.set(0);
  undoState = { l, i, wasActive: l.id === activeId };
  if (l.id === activeId) activeId = layouts[0].id;
  setTimeout(() => { if (!layouts.includes(l)) { c.el.remove(); cards.delete(l.id); } }, 450);
  syncCards(); setFocus(Math.min(i, layouts.length - 1));
  toast(`Deleted "${l.name}"`, true); announce(`Deleted ${l.name}. Press Control Z to undo.`);
}
function undo() {
  if (!undoState) return;
  const { l, i, wasActive } = undoState; undoState = null;
  layouts.splice(i, 0, l); if (wasActive) activeId = l.id;
  let c = cards.get(l.id); if (!c) { c = makeCard(l); cards.set(l.id, c); }
  c.slot.jump(i); c.x.set(0); c.alpha.set(1);
  syncCards(); setFocus(i); toast(`Restored "${l.name}"`);
}
function apply(i) {
  const l = layouts[i]; if (!l) return;
  activeId = l.id; syncCards(); setFocus(i);
  const c = cards.get(l.id); c.lift.set(1, { vel: 10 });
  setTimeout(() => { c.lift.set(0); close(); toast(`"${l.name}" is now active on Display 1`); }, 150);
}
function open() { scrim.classList.add('open'); syncCards(); setFocus(Math.max(0, layouts.findIndex((l) => l.id === activeId)), { animate: false }); openness.set(1); kick(); }
function close() { scrim.classList.remove('open'); openness.set(0); document.getElementById('reopen').focus(); kick(); }

/* Keyboard */
document.addEventListener('keydown', (e) => {
  if (!scrim.classList.contains('open')) {
    if (e.code === 'Space' && e.ctrlKey && e.altKey && e.shiftKey) { e.preventDefault(); open(); }
    return;
  }
  const k = e.key;
  if (k === 'Escape') { e.preventDefault(); close(); }
  else if ((k === 'ArrowDown' || k === 'ArrowUp') && e.altKey) {
    e.preventDefault();
    const to = clampIdx(focusIdx + (k === 'ArrowDown' ? 1 : -1)); if (to === focusIdx) return;
    const [l] = layouts.splice(focusIdx, 1); layouts.splice(to, 0, l);
    const c = cards.get(l.id); c.lift.set(1, { vel: 6 }); setTimeout(() => c.lift.set(0), 160);
    syncCards(); setFocus(to); announce(`${l.name} moved to position ${to + 1} of ${layouts.length}`);
  }
  else if (k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { e.preventDefault(); setFocus(focusIdx + 1); }
  else if (k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { e.preventDefault(); setFocus(focusIdx - 1); }
  else if (k === 'Home') { e.preventDefault(); setFocus(0); }
  else if (k === 'End') { e.preventDefault(); setFocus(layouts.length - 1); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); apply(focusIdx); }
  else if ((k === 'Delete' || k === 'Backspace') && layouts.length > 1) { e.preventDefault(); remove(cards.get(layouts[focusIdx].id), 1, 0); }
  else if (k === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
});
stage.addEventListener('click', (e) => { if (e.target === stage && !drag) close(); });

/* Toast (spring too) + live region */
const toastEl = document.getElementById('toast'), toastSpring = new Spring(0, { k: 380, zeta: 0.8 });
let toastTimer = 0, toastRaf = 0;
function toast(text, withUndo = false) {
  document.getElementById('toastText').textContent = text;
  document.getElementById('undo').hidden = !withUndo;
  toastEl.style.pointerEvents = 'auto'; toastSpring.set(1); runToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastSpring.set(0); toastEl.style.pointerEvents = 'none'; if (withUndo) undoState = null; runToast(); }, withUndo ? 5000 : 2200);
}
function runToast() {
  if (toastRaf) return; let t = performance.now();
  const f = (now) => {
    toastSpring.step(Math.min(0.05, (now - t) / 1000)); t = now;
    const v = toastSpring.value;
    toastEl.style.opacity = Math.max(0, Math.min(1, v));
    toastEl.style.transform = `translate(-50%, ${(1 - v) * 20}px) scale(${0.96 + 0.04 * v})`;
    toastRaf = toastSpring.settled ? 0 : requestAnimationFrame(f);
  };
  toastRaf = requestAnimationFrame(f);
}
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('reopen').addEventListener('click', open);
function announce(t) { live.textContent = ''; requestAnimationFrame(() => (live.textContent = t)); }
open();
</script>
</body>
</html>
