name: release

# Builds installers on every manual run (artifacts only). A GitHub Release is created only when a
# version tag (v*) is pushed, and it is created as a DRAFT: nothing is public until a person reviews
# the assets and presses "Publish release" on GitHub. Nothing here deploys the website.
# Actions are pinned to commit SHAs (Dependabot keeps them current); the Rust toolchain and the
# Tauri CLI are pinned to exact versions.
#
# Adapted from the Windy workflow. Differences: Krova's Tauri app lives in src-tauri/ (its own
# Cargo workspace) and its UI in ui/, which must be built before Tauri bundles it; Krova ships
# for Windows and macOS only.
#
# Asset names are version-free on purpose, so that releases/latest/download/<name> stays stable:
#   Krova-windows-x64-setup.exe   NSIS installer (Windows)
#   Krova-macos-universal.dmg     universal (Apple silicon + Intel); built as an artifact only, not
#                                 attached to releases until it has been tested on a real Mac
# website/src/site.ts (DOWNLOADS) must list exactly these names.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Build jobs only read the repository. The publish job raises this for itself.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundle_dir: src-tauri/target/release/bundle
            args: "--bundles nsis"
          # Windows only for now. To build macOS again (never run on a real Mac), add back:
          #   - name: macos
          #     os: macos-latest
          #     rust_target: aarch64-apple-darwin,x86_64-apple-darwin
          #     bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          #     args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    # The macOS build is not released yet (never run on a real Mac), so it may fail without
    # blocking the release. Its artifact stays available for testing.
    continue-on-error: ${{ matrix.name == 'macos' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain is the input below
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the version $version in src-tauri/tauri.conf.json" >&2
            exit 1
          fi
      # tauri.conf.json has no beforeBuildCommand, so ui/dist must exist before Tauri runs.
      - name: Build the UI
        shell: bash
        run: |
          npm ci --prefix ui
          npm run build --prefix ui
      # Run from the repo root: the Tauri CLI finds src-tauri/tauri.conf.json below the working directory.
      - name: Build installers
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.3 build ${{ matrix.args }}
      - name: Give files version-free names (Windows)
        if: matrix.name == 'windows'
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          installer=$(find "$BUNDLE_DIR/nsis" -type f -name '*-setup.exe' | head -n 1)
          test -n "$installer" || { echo "no NSIS installer found under $BUNDLE_DIR/nsis" >&2; exit 1; }
          cp "$installer" dist-release/Krova-windows-x64-setup.exe
          ls -la dist-release
      - name: Give files version-free names (macOS)
        if: matrix.name == 'macos'
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          dmg=$(find "$BUNDLE_DIR/dmg" -type f -name '*.dmg' ! -name 'rw.*' | head -n 1)
          test -n "$dmg" || { echo "no .dmg found under $BUNDLE_DIR/dmg" >&2; exit 1; }
          cp "$dmg" dist-release/Krova-macos-universal.dmg
          ls -la dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krova-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: docs/release-notes
      # Windows only for now: the macOS build is not released until it has run on a real Mac.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: krova-windows
          path: assets
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Hand-written notes per version (docs/release-notes/<tag>.md); the job fails without them.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/$TAG.md"
          test -f "$notes" || { echo "missing $notes" >&2; exit 1; }
          gh release create "$TAG" assets/* \
            --repo "$REPO" \
            --title "Krova $TAG" \
            --draft \
            --notes-file "$notes"
