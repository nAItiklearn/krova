name: website

# Builds the static site in website/ and publishes it to GitHub Pages. It runs on pushes to main
# that touch the site (or what the site reads at build time) and can be started by hand.
#
# One-time setup, which only a repository admin can do: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until that is switched on, the deploy job fails; the build job still shows
# whether the site builds.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "ui/**"
      - "docs/measurements/**"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            website/package-lock.json
      # The site embeds the real editor (ui/) as a live demo, so both projects need their dependencies.
      - run: npm ci --prefix ui
      - run: npm ci --prefix website
      - run: npm run build --prefix website
      - run: npm run check:links --prefix website
      # No actions/configure-pages step: it fails until Pages is enabled, and its only job (telling the
      # build the base path) is already done by BASE_PATH in website/src/site.ts.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
