[workspace]
resolver = "2"
members = ["crates/krova-core", "crates/krova-platform"]
# The Tauri app is its own workspace so the core crates build without a webview toolchain.
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
